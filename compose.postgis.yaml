# Configuração para o volume EXISTENTE deste ambiente de desenvolvimento.
# Não inicia uma instalação vazia nem cria/substitui volumes automaticamente.
services:
  database:
    build:
      context: ./docker/postgres
    image: perambulando/postgres-postgis:17
    container_name: perambulando-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: perambulando/backend:dev
    container_name: perambulando-backend
    restart: unless-stopped
    environment:
      # Evita aplicar migrations automaticamente ao iniciar sobre o banco local existente.
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5014
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=perambulando;Username=perambulando;Password=perambulando_dev_only
      Geoapify__ApiKey: ${Geoapify__ApiKey:-}
      N8n__TravelChatWebhookUrl: ${N8n__TravelChatWebhookUrl:-http://host.docker.internal:5678/webhook-test/perambulando-travelchat}
      N8n__TravelChatWebhookKey: ${N8n__TravelChatWebhookKey:-}
    ports:
      - "127.0.0.1:5014:5014"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: perambulando/frontend:dev
    container_name: perambulando-frontend
    restart: unless-stopped
    environment:
      CI: "1"
      EXPO_PUBLIC_API_URL: http://localhost:5014
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
    external: true
    name: perambulando_pgdata
